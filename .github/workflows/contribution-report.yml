name: Contribution Report

on:
  schedule:
    # 每天 UTC 1:30（北京时间早上9:30）自动更新
    - cron: "30 1 * * *"
  workflow_dispatch:
    # 支持手动触发
  push:
    branches:
      - main
      - master

# 与 GitHub-Profile-3D-Contrib 共享同一个并发组，避免两个 workflow 同时
# checkout / commit / push 造成 ref 竞争（cannot lock ref）
concurrency:
  group: profile-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 生成贡献报告（遍历所有公开仓库含 Fork，?author= 归因所有关联邮箱）
      # 使用 PAT（secrets.MY_PAT）可统计私有仓库；未配置时自动降级为 GITHUB_TOKEN
      - name: Generate Contribution Report
        env:
          GH_TOKEN: ${{ secrets.MY_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/contribution_report.py

      - name: Commit & Push Report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "📊 Update contribution report [skip ci]"
          # push 失败时先同步远程最新提交再重试，避免 non-fast-forward 拒绝
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed (attempt $attempt/5), pulling latest and retrying..."
            git pull --rebase origin main || { echo "Rebase failed, aborting"; git rebase --abort; exit 1; }
          done
          echo "Push failed after 5 attempts"
          exit 1
