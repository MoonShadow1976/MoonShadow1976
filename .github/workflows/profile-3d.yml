name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # 每天 UTC 18:00（北京时间凌晨2点）自动更新
    - cron: "0 18 * * *"
  workflow_dispatch:
    # 支持手动触发
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- 语言饼图（亮色主题，stats-organization 官方 Action）----
      - name: Generate top-langs card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=pie&langs_count=10&theme=default&hide_border=true
          path: profile/top-langs-light.svg
          token: ${{ secrets.MY_PAT }}

      # ---- 语言饼图（暗色主题，stats-organization 官方 Action）----
      - name: Generate top-langs card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=pie&langs_count=10&theme=github_dark&hide_border=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.MY_PAT }}

      # ---- 3D 贡献图（yoshi389111 官方 Action）----
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # ---- 统一构建：一次拉数据，同时生成
      #       profile/top-langs-with-forks-*.svg
      #       profile-3d-contrib/profile-*-with-forks.svg
      #       profile/lang-repo-sankey.svg
      # 避免多次 API 抓取与多 Job 串行等待 ----
      - name: Build fork-included cards + sankey
        env:
          GH_TOKEN: ${{ secrets.MY_PAT || secrets.GITHUB_TOKEN }}
        run: python -u scripts/build_all.py

      # ---- 所有产物一次性提交推送 ----
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/ profile-3d-contrib/
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "🔄 Update profile cards [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed (attempt $attempt/5), pulling latest and retrying..."
            git pull --rebase origin main || { echo "Rebase failed, aborting"; git rebase --abort; exit 1; }
          done
          echo "Push failed after 5 attempts"
          exit 1
