name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # 每天 UTC 18:00（北京时间凌晨2点）自动更新
    - cron: "0 18 * * *"
  workflow_dispatch:
    # 支持手动触发
  push:
    branches:
      - main
      - master

# 与 Contribution Report 共享同一个并发组，避免两个 workflow 同时
# checkout / commit / push 造成 ref 竞争（cannot lock ref）
concurrency:
  group: profile-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- 语言饼图（亮色主题）----
      # 使用 PAT（secrets.MY_PAT）可统计私有仓库；未配置时自动降级为 GITHUB_TOKEN（仅公开仓库）
      - name: Generate top-langs card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=pie&langs_count=10&theme=default&hide_border=true
          path: profile/top-langs-light.svg
          token: ${{ secrets.MY_PAT }}

      # ---- 语言饼图（暗色主题）----
      - name: Generate top-langs card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=pie&langs_count=10&theme=github_dark&hide_border=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.MY_PAT }}

      # ---- 3D 贡献图（含私有仓库贡献）----
      # 使用 PAT 后，私有仓库的 commit 也会进入贡献统计
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # ---- 含 Fork 版本：语言饼图 + 3D 贡献图（自建脚本）----
      # 自行读取所有仓库（含 Fork）的 languages 与 commits 数据，生成：
      #   profile/top-langs-with-forks-{light,dark}.svg
      #   profile-3d-contrib/profile-{gitblock,night-green}-with-forks.svg
      - name: Generate fork-included cards
        env:
          GH_TOKEN: ${{ secrets.MY_PAT || secrets.GITHUB_TOKEN }}
        run: python -u scripts/generate_with_fork_cards.py

      # ---- 提交所有生成的卡片 ----
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/ profile-3d-contrib/
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "🔄 Update profile cards [skip ci]"
          # push 失败时先同步远程最新提交再重试，避免 non-fast-forward 拒绝
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed (attempt $attempt/5), pulling latest and retrying..."
            git pull --rebase origin main || { echo "Rebase failed, aborting"; git rebase --abort; exit 1; }
          done
          echo "Push failed after 5 attempts"
          exit 1