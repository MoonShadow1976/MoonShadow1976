    <g class="stagger" style="animation-delay: 600ms"><path data-testid="lang-pie" d="M 150.00 105.00 L 114.05 27.98 A 85.00 85.00 0 0 1 124.59 23.89 Z" fill="#E34C26"/></g>
    <g class="stagger" style="animation-delay: 700ms"><path data-testid="lang-pie" d="M 150.00 105.00 L 124.59 23.89 A 85.00 85.00 0 0 1 134.67 21.39 Z" fill="#41B883"/></g>
