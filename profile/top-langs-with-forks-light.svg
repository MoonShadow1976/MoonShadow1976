        <g transform="translate(150, 0)"><g class="stagger" style="animation-delay: 450ms"><circle cx="5" cy="6" r="5" fill="#89E051"/><text data-testid="lang-name" x="15" y="10" class="lang-name">Shell 5.85%</text></g></g>
