<svg xmlns="http://www.w3.org/2000/svg" width="300" height="375" viewBox="0 0 300 375" fill="none" role="img" aria-labelledby="descId">
<title id="titleId"></title><desc id="descId"></desc>

        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #2f80ed;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          .sub {
            font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #6e7781;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          .lang-name {
            font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
            fill: #434d58;
          }
          .stagger {
            opacity: 0;
            animation: fadeInAnimation 0.3s ease-in-out forwards;
          }
          @keyframes fadeInAnimation {
            from { opacity: 0; }
            to   { opacity: 1; }
          }
        </style>

<rect data-testid="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="299" fill="#fffefe" stroke-opacity="0"/>
<g data-testid="card-title" transform="translate(25, 35)">
  <g transform="translate(0, 0)">
    <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
  </g>
</g>
<g transform="translate(25, 52)">
  <text x="0" y="0" class="sub">including forks</text>
</g>
<g data-testid="main-card-body" transform="translate(0, 70)">
  <svg data-testid="lang-items">
    <g class="stagger" style="animation-delay: 100ms"><path data-testid="lang-pie" d="M 150.00 105.00 L 150.00 20.00 A 85.00 85.00 0 1 1 77.07 148.66 Z" fill="#3572A5"/></g>
