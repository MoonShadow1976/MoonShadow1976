        <g transform="translate(0, 60)"><g class="stagger" style="animation-delay: 900ms"><circle cx="5" cy="6" r="5" fill="#F1E05A"/><text data-testid="lang-name" x="15" y="10" class="lang-name">JavaScript 3.86%</text></g></g>
        <g transform="translate(0, 80)"><g class="stagger" style="animation-delay: 1050ms"><circle cx="5" cy="6" r="5" fill="#E34C26"/><text data-testid="lang-name" x="15" y="10" class="lang-name">HTML 3.52%</text></g></g>
        <g transform="translate(150, 0)"><g class="stagger" style="animation-delay: 450ms"><circle cx="5" cy="6" r="5" fill="#41B883"/><text data-testid="lang-name" x="15" y="10" class="lang-name">Vue 3.24%</text></g></g>
        <g transform="translate(150, 20)"><g class="stagger" style="animation-delay: 600ms"><circle cx="5" cy="6" r="5" fill="#F34B7D"/><text data-testid="lang-name" x="15" y="10" class="lang-name">C++ 2.11%</text></g></g>
