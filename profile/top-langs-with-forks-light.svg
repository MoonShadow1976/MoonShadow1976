    <g class="stagger" style="animation-delay: 600ms"><path data-testid="lang-pie" d="M 150.00 105.00 L 112.77 28.59 A 85.00 85.00 0 0 1 128.94 22.65 Z" fill="#41B883"/></g>
    <g class="stagger" style="animation-delay: 700ms"><path data-testid="lang-pie" d="M 150.00 105.00 L 128.94 22.65 A 85.00 85.00 0 0 1 140.00 20.59 Z" fill="#F34B7D"/></g>
