    <g class="stagger" style="animation-delay: 600ms"><path data-testid="lang-pie" d="M 150.00 105.00 L 111.87 29.03 A 85.00 85.00 0 0 1 127.86 22.93 Z" fill="#41B883"/></g>
    <g class="stagger" style="animation-delay: 700ms"><path data-testid="lang-pie" d="M 150.00 105.00 L 127.86 22.93 A 85.00 85.00 0 0 1 138.81 20.74 Z" fill="#F34B7D"/></g>
