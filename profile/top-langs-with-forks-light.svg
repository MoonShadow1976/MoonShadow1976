        <g transform="translate(0, 20)"><g class="stagger" style="animation-delay: 600ms"><circle cx="5" cy="6" r="5" fill="#3178C6"/><text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript 19.61%</text></g></g>
