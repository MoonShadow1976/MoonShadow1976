    <g class="stagger" style="animation-delay: 400ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 90.21 162.27 A 90.00 90.00 0 0 1 61.51 111.40 Z" fill="#E34C26"/></g>
    <g class="stagger" style="animation-delay: 500ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 61.51 111.40 A 90.00 90.00 0 0 1 66.34 61.83 Z" fill="#563D7C"/></g>
    <g class="stagger" style="animation-delay: 600ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 66.34 61.83 A 90.00 90.00 0 0 1 83.86 33.96 Z" fill="#89E051"/></g>
    <g class="stagger" style="animation-delay: 700ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 83.86 33.96 A 90.00 90.00 0 0 1 100.66 19.73 Z" fill="#384D54"/></g>
