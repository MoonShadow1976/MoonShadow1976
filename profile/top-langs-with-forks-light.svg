        <g transform="translate(150, 60)"><g class="stagger" style="animation-delay: 900ms"><circle cx="5" cy="6" r="5" fill="#DEA584"/><text data-testid="lang-name" x="15" y="10" class="lang-name">Rust 2.43%</text></g></g>
        <g transform="translate(150, 80)"><g class="stagger" style="animation-delay: 1050ms"><circle cx="5" cy="6" r="5" fill="#8b949e"/><text data-testid="lang-name" x="15" y="10" class="lang-name">Other 3.28%</text></g></g>
