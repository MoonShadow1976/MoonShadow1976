    <g class="stagger" style="animation-delay: 400ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 78.51 40.32 A 90.00 90.00 0 0 1 93.73 24.76 Z" fill="#F1E05A"/></g>
    <g class="stagger" style="animation-delay: 500ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 93.73 24.76 A 90.00 90.00 0 0 1 110.53 14.12 Z" fill="#E34C26"/></g>
    <g class="stagger" style="animation-delay: 600ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 110.53 14.12 A 90.00 90.00 0 0 1 127.67 7.81 Z" fill="#41B883"/></g>
    <g class="stagger" style="animation-delay: 700ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 127.67 7.81 A 90.00 90.00 0 0 1 139.40 5.63 Z" fill="#F34B7D"/></g>
    <g class="stagger" style="animation-delay: 800ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 139.40 5.63 A 90.00 90.00 0 0 1 143.18 5.26 Z" fill="#8b949e"/></g>
    <g class="stagger" style="animation-delay: 900ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 143.18 5.26 A 90.00 90.00 0 0 1 145.45 5.12 Z" fill="#563D7C"/></g>
    <g class="stagger" style="animation-delay: 1000ms"><path data-testid="lang-pie" d="M 150.00 95.00 L 145.45 5.12 A 90.00 90.00 0 0 1 150.00 5.00 Z" fill="#8b949e"/></g>
    <g transform="translate(0, 210)">
      <svg data-testid="lang-names" x="0">
        <g transform="translate(0, 0)"><g class="stagger" style="animation-delay: 450ms"><circle cx="5" cy="6" r="5" fill="#3572A5"/><text data-testid="lang-name" x="15" y="10" class="lang-name">Python 66.37%</text></g></g>
        <g transform="translate(0, 20)"><g class="stagger" style="animation-delay: 600ms"><circle cx="5" cy="6" r="5" fill="#8b949e"/><text data-testid="lang-name" x="15" y="10" class="lang-name">PLpgSQL 14.46%</text></g></g>
